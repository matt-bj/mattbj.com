<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">  
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Bellringer Jones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="top-socials">
  <a href="https://app.spotlight.com/2057-7835-5658" target="_blank"><i class="fa-solid fa-star"></i></a>
  <a href="https://www.imdb.com/name/nm16629043/" target="_blank"><i class="fa-brands fa-imdb"></i></a>
  <a href="https://www.youtube.com/@mattbj" target="_blank"><i class="fa-brands fa-youtube"></i></a>
  <a href="https://www.instagram.com/bellringerjones" target="_blank"><i class="fa-brands fa-instagram"></i></a>
</div>
  <h1>Matt Bellringer Jones</h1>
  <p class="tag">Character actor — grounded intensity, authority, and dark comedic edge</p>
</header>

<section class="hero">
  <div class="main-wrapper">
  <button class="nav prev" onclick="prevImage()">‹</button>

  <img id="mainDisplay" src="images/headshot.jpg" alt="Matt Bellringer Jones headshot">

  <button class="nav next" onclick="nextImage()">›</button>
</div>
</section>

<section class="info">
  <p>Clips available on request.</p>

  <div class="links">
    <a href="https://www.imdb.com/name/nm16629043/" target="_blank">IMDb</a>
    <a href="https://app.spotlight.com/2057-7835-5658" target="_blank">Spotlight</a>
    <a href="https://www.instagram.com/bellringerjones" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/@mattbj" target="_blank">YouTube</a>
  </div>
</section>

<section class="stills">
  <h2>Stills</h2>

  <!-- Thumbnail row -->
  <div class="thumb-row">
    <img src="images/headshot.jpg" onclick="swapImage(this)">
    <img src="images/alt.jpg" onclick="swapImage(this)">
    <img src="images/headshot2.jpg" onclick="swapImage(this)">
    <img src="images/fullbody.jpg" onclick="swapImage(this)">
    <img src="images/costume1.jpg" class="crop-thumb" onclick="swapImage(this)">
    <img src="images/costume2.jpg" onclick="swapImage(this)">
      </div>
</section>

<section class="contact">
  <h2>Contact</h2>

 <form action="https://formspree.io/f/xaqvyvzr" method="POST">

    <input type="hidden" name="_subject" value="New message from mattbj.com">
    <input type="text" name="_gotcha" style="display:none">

    <input type="text" name="name" placeholder="Name" required>

    <input type="email" name="email" placeholder="Email" required>

    <textarea name="message" placeholder="Message" required></textarea>

    <button type="submit">Send</button>
  </form>
</section>

<footer>
  <p>Contact via Spotlight or Instagram</p>
</footer>

<script>
const images = Array.from(document.querySelectorAll(".thumb-row img")).map(img => img.src);

let currentIndex = 0;

function showImage(index) {
  const main = document.getElementById("mainDisplay");
  currentIndex = (index + images.length) % images.length;
  main.src = images[currentIndex];
}

function swapImage(img) {
  const index = images.indexOf(img.src);
  showImage(index);
}

function nextImage() {
  showImage(currentIndex + 1);
}

function prevImage() {
  showImage(currentIndex - 1);
}
</script>

</body>
</html>
